<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CRUD livro</title>
    <link rel="stylesheet" href="livro.css">
</head>

<body onload="inicializar()">
    <header>
        <h1>Cadastro de Livros</h1>
        <p>Gerencie o estoque de livros do sistema.</p>
    </header>

    <main class="container-master">
        <div class="conteudo-principal">
            <section class="form-esquerda">
                <h2>Dados do Livro</h2>
                
                <label for="inputId_livro">ID do livro</label>
                <div class="linha-id">
                    <input type="text" name="inputId_livro" id="inputId_livro" placeholder="Ex: 1">
                    <input type="button" value="Procure" id="btProcure" onclick="procure()">
                    <input type="button" value="Inserir" id="btInserir" onclick="inserir()" style="display:none;">
                    <input type="button" value="Alterar" id="btAlterar" onclick="alterar()" style="display:none;">
                    <input type="button" value="Excluir" id="btExcluir" onclick="excluir()" style="display:none;">
                </div>

                <label for="inputNome_livro">Nome do livro</label>
                <input type="text" name="inputNome_livro" id="inputNome_livro">

                <label for="selectId_genero">Gênero</label>
                <select name="selectId_genero" id="selectId_genero" disabled>
                    <option value="">Carregando...</option>
                </select>

                <label for="inputAutor">Autor</label>
                <input type="text" name="inputAutor" id="inputAutor">

                <label for="inputPreco">Preço Unitário (R$)</label>
                <input type="number" step="0.01" name="inputPreco" id="inputPreco">

                <label for="inputPaginas">Número de páginas</label>
                <input type="number" name="inputPaginas" id="inputPaginas">

                <div id="divAviso">Informe o ID e clique em Procure</div>

                <div class="botoes-acao">
                    <input type="button" value="Salvar" id="btSalvar" onclick="salvar()" style="display:none;">
                    <input type="button" value="Cancelar" id="btCancelar" onclick="cancelarOperacao()" style="display:none;">
                </div>
            </section>

            <aside class="form-direita">
                <h2>Imagem do livro</h2>
                <p class="instrucao-imagem">(Clique na imagem para alterar)</p>
                <div class="img-container">
                    <img id="imglivro" src="http://localhost:3001/imagens/silhueta.png" alt="Imagem do livro" onclick="acionarUpload()">
                    <input type="file" id="inputImagem" accept="image/*" style="display: none;" onchange="previewImagem()">
                </div>
            </aside>
        </div>

        <section class="lista-livros">
            <h3>Livros Cadastrados</h3>
            <div id="outputSaida">Carregando...</div>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 Sistema CRUD livros. Todos os direitos reservados.</p>
    </footer>

    <script src="./livro.js"></script>
</body>

</html>
