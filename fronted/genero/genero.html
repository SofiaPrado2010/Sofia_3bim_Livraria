<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CRUD Unidade de Medida</title>
    <link rel="stylesheet" href="genero.css">
</head>

<body onload="listar()">
    <header>
        <h1>Cadastro de Gêneros</h1>
        <p>Gerencie os gêneros do sistema.</p>
    </header>

    <main class="container-master">
        <div class="conteudo-principal">
            <section class="form-esquerda">
                <h2>Dados do Gênero</h2>
                
                <label for="inputId_genro">ID do gênero</label>
                <div class="linha-id">
                    <input type="text" name="inputId_genero" id="inputId_genero"  style="text-transform: uppercase;">
                    <input type="button" value="Procure" id="btProcure" onclick="procure()">
                    <input type="button" value="Inserir" id="btInserir" onclick="inserir()" style="display:none;">
                    <input type="button" value="Alterar" id="btAlterar" onclick="alterar()" style="display:none;">
                    <input type="button" value="Excluir" id="btExcluir" onclick="excluir()" style="display:none;">
                </div>

                <label for="inputNome_genero">Nome do Genero</label>
                <input type="text" name="inputNome_genero" id="inputNome_genero" placeholder="Ex: Ficção Científica">

                <div id="divAviso">Informe o ID e clique em Procure</div>

                <div class="botoes-acao">
                    <input type="button" value="Salvar" id="btSalvar" onclick="salvar()" style="display:none;">
                    <input type="button" value="Cancelar" id="btCancelar" onclick="cancelarOperacao()" style="display:none;">
                </div>
            </section>
        </div>

        <section class="lista-filmes">
            <h3>Genero Cadastrados</h3>
            <div id="outputSaida">Carregando...</div>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 Sistema CRUD Generos. Todos os direitos reservados.</p>
    </footer>

    <script src="./genero.js"></script>
</body>

</html>
